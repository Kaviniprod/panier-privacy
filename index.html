<title>Panier</title>
<style>
:root { color-scheme: light dark; --fg: #1d1d1f; --bg: #fff; --muted: #5f6368; --link: #0b57d0; }
@media (prefers-color-scheme: dark) { :root { --fg: #e8eaed; --bg: #1b1b1d; --muted: #a0a4a8; --link: #8ab4f8; } }
body { background: var(--bg); color: var(--fg); font: 17px/1.6 system-ui, sans-serif;
       max-width: 42rem; margin: 0 auto; padding: 1rem 16px 4rem; }
a { color: var(--link); }
nav { color: var(--muted); font-size: 15px; margin-bottom: 1.5rem; }
h1 { font-size: 1.7rem; line-height: 1.25; }
h2 { font-size: 1.3rem; margin-top: 2.2rem; }
h3 { font-size: 1.1rem; margin-top: 1.6rem; }
button { font: inherit; padding: .6rem 1rem; margin: .25rem .5rem .25rem 0; border-radius: 8px;
         border: 1px solid var(--muted); background: transparent; color: var(--fg); cursor: pointer; }
button.danger { background: #b3261e; border-color: #b3261e; color: #fff; }
button:disabled { opacity: .6; cursor: default; }
#dw-error { color: #b3261e; }
@media (prefers-color-scheme: dark) { #dw-error { color: #f2b8b5; } }
</style>
</head>
